# Publishes @adeshsuryan/next-build-doctor to JSR on version tags.
# Uses OIDC provenance: the JSR package is linked to this GitHub repository,
# so no token secret is needed (id-token: write is enough).
name: Publish JSR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish
        run: npx jsr publish
